name: Import revised tenth-degree polynomial note

on:
  push:
    branches: [main]
    paths:
      - '.github/imports/tenth-degree/**'
      - '.github/workflows/import_tenth_degree_note.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-tenth-degree-note
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            .github/imports/tenth-degree
            maths/algebra_tenth_degree_polynomial
      - name: Restore verified project sources
        id: restore
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, lzma, os, tarfile
          from pathlib import Path, PurePosixPath
          prefix = 'maths/algebra_tenth_degree_polynomial/'
          archive = b''.join(Path(f'.github/imports/tenth-degree/part{i:02d}').read_bytes() for i in range(1, 6))
          assert hashlib.sha256(archive).hexdigest() == 'ccd7f9e2f408d447f2020de715eaa49ad3e00bdc2be2125e1fd60267d76b52d9', 'Archive checksum mismatch'
          manifest = {}
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(archive)), mode='r:') as tar:
              members = tar.getmembers()
              assert len(members) == 12
              for member in members:
                  name = member.name
                  assert member.isfile() and name.startswith(prefix) and '..' not in PurePosixPath(name).parts
                  payload = tar.extractfile(member).read()
                  target = Path(name)
                  if target.exists():
                      assert target.read_bytes() == payload, f'Refusing to overwrite different content: {name}'
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(payload)
                  manifest[name] = hashlib.sha256(payload).hexdigest()
          temporary = Path(os.environ['RUNNER_TEMP'])
          (temporary / 'tenth-degree-manifest.json').write_text(json.dumps(manifest))
          (temporary / 'tenth-degree-original.bbl').write_bytes(Path(prefix + 'main.bbl').read_bytes())
          print('Verified archive and restored all 12 source/documentation files.')
          PY
      - name: Compile approved manuscript
        uses: xu-cheng/latex-action@v3
        with:
          texlive_version: '2024'
          root_file: main.tex
          working_directory: maths/algebra_tenth_degree_polynomial
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
          extra_system_packages: poppler-utils
          post_compile: |
            pdfinfo main.pdf > pdfinfo.txt
            pdftotext -layout main.pdf main.extracted.txt
      - name: Check PDF and unchanged source files
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          directory = Path('maths/algebra_tenth_degree_polynomial')
          temporary = Path(os.environ['RUNNER_TEMP'])
          directory.joinpath('main.bbl').write_bytes((temporary / 'tenth-degree-original.bbl').read_bytes())
          manifest = json.loads((temporary / 'tenth-degree-manifest.json').read_text())
          for name, expected in manifest.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, f'Source changed: {name}'
          info = (directory / 'pdfinfo.txt').read_text()
          assert re.search(r'^Pages:\s+28\s*$', info, re.M), info
          pdf = (directory / 'main.pdf').read_bytes()
          assert pdf.startswith(b'%PDF-') and len(pdf) > 100000
          log = (directory / 'main.log').read_text(errors='replace')
          for text in ('There were undefined references', 'multiply-defined labels', 'Overfull \\hbox', 'Overfull \\vbox'):
              assert text not in log, text
          extracted = (directory / 'main.extracted.txt').read_text()
          pages = extracted.split('\f')
          assert 'Glossary of notation' in pages[0]
          assert 'vanishing coefficients' in extracted
          assert 'Solution of the motivating equation' in extracted
          pdf_hash = hashlib.sha256(pdf).hexdigest()
          report = '# Repository import and build verification\n\n'
          report += 'The layout_v2 project sources were imported without changes. All 12 imported files passed SHA-256 verification. The PDF was regenerated from main.tex with TeX Live 2024 and BibTeX.\n\n'
          report += '- PDF pages: 28\n- Glossary starts on the first page.\n- No undefined references, duplicate labels, or overfull horizontal/vertical boxes were found in the final compilation log.\n'
          report += '- PDF SHA-256: `' + pdf_hash + '`\n'
          report += '- Source archive SHA-256: `ccd7f9e2f408d447f2020de715eaa49ad3e00bdc2be2125e1fd60267d76b52d9`\n'
          report += '- Build run: https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\n\n'
          report += 'The regenerated PDF may differ at byte level from the earlier compiled copy because of PDF metadata. No new mathematical or bibliographical verification was performed during this import.\n\n'
          report += '## Imported file checksums\n\n```text\n' + '\n'.join(digest + '  ' + name for name, digest in sorted(manifest.items())) + '\n```\n'
          (directory / 'history' / 'IMPORT_BUILD.md').write_text(report)
          (directory / 'pdfinfo.txt').unlink()
          (directory / 'main.extracted.txt').unlink()
          print(info)
          print('Verified unchanged sources and a 28-page PDF:', pdf_hash)
          PY
      - name: Commit project and remove transfer files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maths/algebra_tenth_degree_polynomial
          git rm .github/imports/tenth-degree/part01 .github/imports/tenth-degree/part02 .github/imports/tenth-degree/part03 .github/imports/tenth-degree/part04 .github/imports/tenth-degree/part05
          git diff --cached --stat
          git commit -m 'Add revised tenth-degree polynomial teaching note with compiled PDF'
          git pull --rebase origin main
          git push origin HEAD:main
